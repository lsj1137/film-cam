<!doctype html><meta charset="utf-8"><body style="margin:0;background:#222">
<canvas id="v" style="display:none"></canvas><canvas id="out"></canvas>
<script type="module">
import { FilmRenderer, PRESETS } from '../film.js';
const img = new Image(); img.src = 'test.jpg'; await img.decode();
const r = new FilmRenderer(document.getElementById('v'));
const out = document.getElementById('out');
const s = 0.4, w = img.width * s, h = img.height * s;
out.width = w * (PRESETS.length + 1); out.height = h;
const ctx = out.getContext('2d');
r.upload(img, img.width, img.height);
r.render(PRESETS[0], { bypass: true }); ctx.drawImage(r.canvas, 0, 0, w, h);
PRESETS.forEach((p, i) => { r.render(p, { seed: 0.5 }); ctx.drawImage(r.canvas, w * (i + 1), 0, w, h); });
document.title = 'done';
</script>
