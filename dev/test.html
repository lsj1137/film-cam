<!doctype html><meta charset="utf-8"><body style="margin:0;background:#222">
<canvas id="v" style="display:none"></canvas><canvas id="out"></canvas>
<script type="module">
// 테스트 이미지마다 한 줄씩: 원본 + 프리셋 전부
import { FilmRenderer, PRESETS } from '../film.js';
const files = (new URLSearchParams(location.search).get('img') ?? 'test.jpg,test-night.jpg,test-portrait.jpg').split(',');
const imgs = await Promise.all(files.map(async (f) => { const i = new Image(); i.src = f; await i.decode(); return i; }));
const r = new FilmRenderer(document.getElementById('v'));
const out = document.getElementById('out');
const cw = 200, ch = 267;
out.width = cw * (PRESETS.length + 1); out.height = ch * imgs.length;
const ctx = out.getContext('2d');
imgs.forEach((img, row) => {
  r.upload(img, img.width, img.height);
  r.render(PRESETS[0], { bypass: true }); ctx.drawImage(r.canvas, 0, ch * row, cw, ch);
  PRESETS.forEach((p, i) => { r.render(p, { seed: 0.5 }); ctx.drawImage(r.canvas, cw * (i + 1), ch * row, cw, ch); });
});
document.title = 'done';
</script>
