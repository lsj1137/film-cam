# cam.stillim.dev : 필름캠 (정적 PWA). 파일은 /var/www/film-cam (film-cam/deploy/deploy.sh 로 배포)
# HTTPS는 certbot --nginx -d cam.stillim.dev 로 붙인다.
server {
    listen 80;
    listen [::]:80;
    server_name cam.stillim.dev;

    root /var/www/film-cam;
    index index.html;

    # 파일이 작으니 매번 ETag로 확인만 하게 해서 배포가 바로 반영되게 한다
    add_header Cache-Control "no-cache" always;
    add_header Permissions-Policy "camera=(self)" always;
    add_header X-Content-Type-Options "nosniff" always;

    location / {
        try_files $uri $uri/ =404;
    }

    location = /manifest.webmanifest {
        types { }
        default_type application/manifest+json;
    }

    location ~ /\. {
        deny all;
    }
}
