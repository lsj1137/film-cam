<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#14110f">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="필름캠">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="style.css">
  <title>필름캠</title>
</head>
<body>
  <main class="app">
    <header class="topbar">
      <button class="top-btn" id="flashBtn" aria-label="플래시" aria-pressed="false">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round"><path d="M13 3L5 13.5h6L10 21l8-10.5h-6z"/><path class="slash" d="M4 4l16 16"/></svg>
      </button>
      <button class="top-btn ratio" id="ratioBtn" aria-label="사진 비율">3:4</button>
      <button class="top-btn zoom-btn" id="zoomBtn" aria-label="배율">1×</button>
      <button class="top-btn" id="gridBtn" aria-label="격자" aria-pressed="false">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="3.5" y="3.5" width="17" height="17" rx="2"/><path d="M9.2 3.5v17M14.8 3.5v17M3.5 9.2h17M3.5 14.8h17"/></svg>
      </button>
    </header>

    <section class="viewfinder" id="viewfinder">
      <div class="frame" id="frame">
        <canvas id="view"></canvas>
        <div class="grid" id="grid" hidden></div>
      </div>
      <video id="video" playsinline muted autoplay></video>
      <div class="flash" id="flash"></div>
      <div class="badge" id="badge">원본</div>
      <button class="close-image" id="closeImage" hidden aria-label="카메라로 돌아가기">✕</button>
      <div class="placeholder" id="placeholder" hidden>
        <p id="placeholderText">카메라를 켜려면 아래 버튼을 눌러 주세요</p>
        <button class="pill" id="startBtn">카메라 켜기</button>
      </div>
    </section>

    <div class="film-drawer" id="filmDrawer">
      <div class="film-carousel" id="filmCarousel" role="listbox" aria-label="필름 선택"></div>
      <button class="chevron-btn" id="filmToggle" aria-label="필름 선택" aria-expanded="false">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 15l6-6 6 6"/></svg>
      </button>
    </div>

    <section class="controls">
      <label class="side-btn" aria-label="사진 불러오기">
        <input type="file" id="fileInput" accept="image/*" hidden>
        <svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2.5"/><circle cx="9" cy="10" r="1.8"/><path d="M21 16l-5.5-5.5L6 20"/></svg>
      </label>
      <button class="shutter" id="shutter" aria-label="촬영"></button>
      <button class="side-btn" id="flipBtn" aria-label="카메라 전환">
        <svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8h3l1.5-2h7L17 8h3v11H4z"/><path d="M9.5 12.5a2.8 2.8 0 0 1 4.9-1.3M14.5 14a2.8 2.8 0 0 1-4.9 1.3"/><path d="M14.6 9.6v1.8h-1.8M9.4 16.4v-1.8h1.8"/></svg>
      </button>
    </section>
  </main>

  <div class="screen-flash" id="screenFlash"></div>
  <div class="toast" id="toast" role="status"></div>

  <div class="review" id="review" hidden>
    <div class="review-stage">
      <!-- 왼쪽은 필름, 오른쪽은 원본. 세로선을 끌어서 비교 -->
      <div class="compare" id="compare">
        <img id="originalImg" alt="원본 사진" draggable="false">
        <img id="reviewImg" alt="필름 사진" draggable="false">
        <div class="compare-line"><span class="compare-knob"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 7l-5 5 5 5M15 7l5 5-5 5"/></svg></span></div>
        <span class="compare-tag left">필름</span>
        <span class="compare-tag right">원본</span>
      </div>
    </div>
    <!-- 정보 프레임일 때만: 회전, 제목 -->
    <div class="frame-tools" id="frameTools" hidden>
      <button class="tool-btn" id="rotateBtn">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12a8 8 0 1 0 2.4-5.7"/><path d="M4 4v4.5h4.5"/></svg>
        <span>회전</span>
      </button>
      <button class="tool-btn" id="titleBtn">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 6h14M12 6v13M9 19h6"/></svg>
        <span id="titleLabel">제목</span>
      </button>
    </div>
    <!-- 날짜일 때만: 시간도 넣을지 -->
    <div class="frame-tools" id="dateTools" hidden>
      <button class="tool-btn" id="timeBtn" aria-pressed="false">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/></svg>
        <span>시간도 표시</span>
      </button>
    </div>
    <div class="review-bar">
      <button class="text-btn" id="discardBtn">다시 찍기</button>
      <button class="text-btn stamp-btn" id="stampBtn" aria-label="사진에 날짜·정보 넣기">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="5" width="17" height="15" rx="2"/><path d="M3.5 9.5h17M8 3v4M16 3v4"/></svg>
        <span id="stampLabel">표시 없음</span>
      </button>
      <button class="text-btn strong" id="saveBtn">저장</button>
    </div>

    <!-- 아이폰 액션 시트처럼 아래에서 올라오는 저장 선택 -->
    <div class="sheet-layer" id="saveSheet" hidden>
      <div class="sheet-backdrop" id="saveBackdrop"></div>
      <div class="action-sheet">
        <div class="sheet-group">
          <p class="sheet-title">원본 사진도 같이 저장할까요?</p>
          <button id="saveFilmOnly">필름 사진만 저장</button>
          <button id="saveWithOriginal">원본도 함께 저장</button>
        </div>
        <button class="sheet-cancel" id="saveCancel">취소</button>
      </div>
    </div>
  </div>

  <script type="module" src="app.js"></script>
</body>
</html>
