<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#14110f">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="필름캠">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="style.css">
  <title>필름캠</title>
</head>
<body>
  <main class="app">
    <header class="topbar">
      <button class="top-btn" id="flashBtn" aria-label="플래시" aria-pressed="false">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round"><path d="M13 3L5 13.5h6L10 21l8-10.5h-6z"/><path class="slash" d="M4 4l16 16"/></svg>
      </button>
      <button class="top-btn ratio" id="ratioBtn" aria-label="사진 비율">3:4</button>
      <button class="top-btn" id="gridBtn" aria-label="격자" aria-pressed="false">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="3.5" y="3.5" width="17" height="17" rx="2"/><path d="M9.2 3.5v17M14.8 3.5v17M3.5 9.2h17M3.5 14.8h17"/></svg>
      </button>
    </header>

    <section class="viewfinder" id="viewfinder">
      <div class="frame" id="frame">
        <canvas id="view"></canvas>
        <div class="grid" id="grid" hidden></div>
      </div>
      <video id="video" playsinline muted autoplay></video>
      <div class="flash" id="flash"></div>
      <div class="badge" id="badge">원본</div>
      <button class="close-image" id="closeImage" hidden aria-label="카메라로 돌아가기">✕</button>
      <div class="placeholder" id="placeholder" hidden>
        <p id="placeholderText">카메라를 켜려면 아래 버튼을 눌러 주세요</p>
        <button class="pill" id="startBtn">카메라 켜기</button>
      </div>
    </section>

    <nav class="presets" id="presets"></nav>

    <section class="controls">
      <label class="side-btn" aria-label="사진 불러오기">
        <input type="file" id="fileInput" accept="image/*" hidden>
        <svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2.5"/><circle cx="9" cy="10" r="1.8"/><path d="M21 16l-5.5-5.5L6 20"/></svg>
      </label>
      <button class="shutter" id="shutter" aria-label="촬영"></button>
      <button class="side-btn" id="flipBtn" aria-label="카메라 전환">
        <svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8h3l1.5-2h7L17 8h3v11H4z"/><path d="M9.5 12.5a2.8 2.8 0 0 1 4.9-1.3M14.5 14a2.8 2.8 0 0 1-4.9 1.3"/><path d="M14.6 9.6v1.8h-1.8M9.4 16.4v-1.8h1.8"/></svg>
      </button>
    </section>
  </main>

  <div class="screen-flash" id="screenFlash"></div>
  <div class="toast" id="toast" role="status"></div>

  <div class="review" id="review" hidden>
    <img id="reviewImg" alt="찍은 사진">
    <div class="review-actions" id="reviewActions">
      <button class="pill" id="discardBtn">다시 찍기</button>
      <button class="pill primary" id="saveBtn">저장</button>
    </div>
    <div class="save-sheet" id="saveSheet" hidden>
      <p>원본 사진도 같이 저장할까요?</p>
      <div class="save-choices">
        <button class="pill" id="saveFilmOnly">필름 사진만</button>
        <button class="pill primary" id="saveWithOriginal">원본도 함께</button>
      </div>
      <button class="link-btn" id="saveCancel">취소</button>
    </div>
  </div>

  <script type="module" src="app.js"></script>
</body>
</html>
